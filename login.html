<!DOCTYPE html>
<html lang="es-UY">
<head>
<title>RouteEV · Iniciar sesión</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/login.css" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0e13" />
</head>

<body class="login-page">
  <svg class="login-bg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 600" aria-hidden="true">
    <g class="edge">
      <line x1="40" y1="500" x2="180" y2="420" />
      <line x1="180" y1="420" x2="150" y2="280" />
      <line x1="150" y1="280" x2="280" y2="200" />
      <line x1="280" y1="200" x2="420" y2="230" />
      <line x1="420" y1="230" x2="520" y2="140" />
      <line x1="520" y1="140" x2="660" y2="110" />
      <line x1="420" y1="230" x2="470" y2="360" />
      <line x1="470" y1="360" x2="620" y2="400" />
      <line x1="620" y1="400" x2="740" y2="330" />
      <line x1="150" y1="280" x2="60" y2="200" />
      <line x1="470" y1="360" x2="380" y2="470" />
      <line x1="620" y1="400" x2="600" y2="540" />
    </g>
    <polyline class="route" points="40,500 180,420 150,280 280,200 420,230 520,140 660,110" />
    <g class="node">
      <circle cx="40" cy="500" r="4" />
      <circle cx="180" cy="420" r="4" />
      <circle cx="150" cy="280" r="4" />
      <circle cx="280" cy="200" r="4" />
      <circle cx="420" cy="230" r="4" />
      <circle cx="520" cy="140" r="4" />
      <circle cx="660" cy="110" r="4" />
      <circle cx="60" cy="200" r="3" />
      <circle cx="470" cy="360" r="3" />
      <circle cx="620" cy="400" r="3" />
      <circle cx="740" cy="330" r="3" />
      <circle cx="380" cy="470" r="3" />
      <circle cx="600" cy="540" r="3" />
    </g>
  </svg>

  <div class="login-card">
    <a href="/" class="back-link">&larr; Volver al inicio</a>
    <div class="eyebrow">Uruguay</div>
    <h1 class="brand-lockup login-brand">
      <img src="/img/logo-mark.svg" class="brand-icon" alt="" />
      <span class="brand-word">Route</span><span class="brand-ai">EV</span>
    </h1>
    <p class="tagline">Entra a tu cuenta para calcular tu proxima ruta.</p>

    <div class="mode-label" id="mode-label">Iniciar sesión</div>

    <div id="error-banner" class="error-banner hidden"></div>
    <div id="info-banner" class="info-banner hidden"></div>

    <div id="login-view">
      <form id="login-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="ej. nombre@dominio.com" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <div class="login-actions">
          <button type="submit" id="submit-btn" class="primary">Entrar</button>
          <button type="button" id="toggle-mode" class="toggle-mode">Crear una cuenta nueva</button>
        </div>
      </form>

      <div class="google-divider hidden" id="google-divider"><span>o</span></div>
      <div id="google-signin-btn"></div>
    </div>

    <div id="confirm-view" class="hidden">
      <p class="tagline" id="confirm-copy">Te mandamos un código de 6 dígitos por correo. Ingresalo para confirmar tu cuenta.</p>
      <form id="confirm-form">
        <div class="field">
          <label for="confirm-code">Código de confirmación</label>
          <input id="confirm-code" name="code" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required placeholder="123456" />
        </div>
        <div class="login-actions">
          <button type="submit" id="confirm-submit-btn" class="primary">Confirmar</button>
          <button type="button" id="resend-code-btn" class="toggle-mode">Reenviar código</button>
          <button type="button" id="back-to-login-btn" class="toggle-mode">Volver a iniciar sesión</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/js/env.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
