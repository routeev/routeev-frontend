<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <!-- Sincrónico y lo más arriba posible a propósito: fija data-theme antes
         de que se aplique cualquier CSS, para que quien eligió "claro" no
         vea un parpadeo en oscuro (el default de toda la vida) al cargar la
         página. Ver src/theme/theme.ts -- misma clave de localStorage. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("routeev_theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <!-- /favicon.ico explícito (no solo el SVG): Google Search y varios
         crawlers/navegadores viejos chequean esa ruta fija sin mirar el
         <link>, y sin este archivo caía al catch-all de la SPA (index.html
         servido como si fuera el ícono), por eso no aparecía en resultados
         de Google pese a que el SVG andaba bien en el navegador. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e13" />
    <meta
      name="description"
      content="Calculá si tu auto eléctrico llega, y dónde parar a cargar, sobre el mapa vial real de Uruguay y las 259 estaciones de carga de UTE y de operadores privados. 631 modelos precargados, sin crear cuenta."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    <meta property="og:site_name" content="RouteEV" />
    <meta property="og:url" content="https://routeev.uy/" />
    <meta property="og:title" content="¿Llega tu auto eléctrico? Fijate antes de salir." />
    <meta
      property="og:description"
      content="Elegí uno de 631 modelos, marcá origen y destino, y RouteEV te dice si llegás, dónde cargar y cuánto sale. Sobre el mapa real de Uruguay."
    />
    <meta property="og:image" content="https://routeev.uy/img/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="631" />
    <meta property="og:image:alt" content="RouteEV — planificá viajes en auto eléctrico por Uruguay" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="¿Llega tu auto eléctrico? Fijate antes de salir." />
    <meta
      name="twitter:description"
      content="Elegí uno de 631 modelos, marcá origen y destino, y RouteEV te dice si llegás, dónde cargar y cuánto sale. Sobre el mapa real de Uruguay."
    />
    <meta name="twitter:image" content="https://routeev.uy/img/og-cover.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>RouteEV — Planificá viajes en auto eléctrico por Uruguay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
